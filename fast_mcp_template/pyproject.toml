[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fast-mcp-template"
version = "0.1.0"
description = "Reusable template for exposing a FastAPI backend's own endpoints as MCP tools via fastapi_mcp, on top of the same layered CRUD/Docker/Poetry base as fastapi_template."
authors = ["Ayush Sood"]

[tool.poetry.dependencies]
python = "^3.11"
# "standard" extra pulls in fastapi-cli (the `fastapi` command: `fastapi dev`
# / `fastapi run`), uvicorn[standard] (includes uvloop + httptools -- tip 1),
# httpx, and python-multipart. One extras flag instead of pinning each
# separately.
fastapi = { extras = ["standard"], version = "^0.115" }
fastapi-mcp = "^0.4"
# fastapi-mcp 0.4.0 calls the mcp SDK's Server() with a positional arg that
# mcp>=2.0 made keyword-only (TypeError at import time). Verified broken
# 2026-09-13 with mcp 2.2.0; pin below until fastapi-mcp ships a fix.
mcp = "<2.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.29"
alembic = "^1.13"
pydantic-settings = "^2.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
anyio = "^4.4"          # tip 10: pytest.mark.anyio instead of pytest-asyncio
aiosqlite = "^0.20"     # in-memory DB for tests, see tests/conftest.py
ruff = "^0.6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in argument default) fires on every `Depends(...)` --
# that's FastAPI's own documented DI pattern, not a bug to fix.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
