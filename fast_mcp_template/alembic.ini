[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is deliberately absent -- migrations/env.py reads the real
# URL from app.core.config.Settings (env vars / .env) so there's one source
# of truth instead of two DB URLs that can drift out of sync.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
